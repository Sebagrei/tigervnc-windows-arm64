name: Build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build-windows-arm64:
    # windows-11-arm is a native arm64 runner (real Arm hardware, not
    # emulated), so this produces a true native arm64 build rather than a
    # cross-compiled one. CLANGARM64 is the MSYS2 environment for that target.
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      VERBOSE: 1
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
      - name: Install dependencies
        run: |
          pacman --sync --noconfirm --needed \
            make mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake
          pacman --sync --noconfirm --needed \
            mingw-w64-clang-aarch64-fltk1.3 mingw-w64-clang-aarch64-libjpeg-turbo \
            mingw-w64-clang-aarch64-gnutls mingw-w64-clang-aarch64-pixman \
            mingw-w64-clang-aarch64-nettle mingw-w64-clang-aarch64-gmp \
            mingw-w64-clang-aarch64-gtest
      - name: Configure
        run: |
          cmake \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_NLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_AUDIO=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DBUILD_VIEWER=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Collect binaries
        working-directory: build
        run: |
          mkdir -p release/arm64
          cp vncviewer/vncviewer.exe release/arm64/
          cp win/winvnc/winvnc4.exe release/arm64/
          cp win/vncconfig/vncconfig.exe release/arm64/
          cp win/wm_hooks/wm_hooks.dll release/arm64/
      - name: Bundle runtime DLLs
        working-directory: build
        run: |
          deps=$(for f in release/arm64/*.exe release/arm64/*.dll; do ldd "$f"; done \
            | grep -oE '/clangarm64/bin/[^ ]+\.dll' \
            | sort -u)
          echo "$deps" | while read -r dep; do cp -n "$dep" release/arm64/; done

          # api-ms-win-crt-*.dll are Windows API-set forwarders with no real
          # file even on the target machine, so those are expected here.
          missing=$(for f in release/arm64/*.exe release/arm64/*.dll; do ldd "$f"; done \
            | grep -i 'not found' | grep -vi 'api-ms-win-' || true)
          if [ -n "$missing" ]; then
            echo "::error::Unresolved dependencies found:"
            echo "$missing"
            exit 1
          fi

          ls -la release/arm64/
      - uses: actions/upload-artifact@v7
        with:
          name: Windows (arm64)
          path: build/release/arm64/
      - name: Package release archive
        id: package-release
        working-directory: build/release
        run: |
          archive_name="tigervnc-windows-arm64-${GITHUB_SHA}.zip"
          cmake -E tar cf "$archive_name" --format=zip arm64
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-release-archive
          path: build/release/${{ steps.package-release.outputs.archive_name }}
      - name: Test
        continue-on-error: true
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-junit test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-arm64
          path: build/tests/unit/test-results.xml

  report-windows-arm64:
    name: Unit tests (Windows arm64)
    runs-on: ubuntu-latest
    needs: build-windows-arm64
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-windows-arm64
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  publish-windows-arm64-release:
    name: Publish Windows arm64 release
    runs-on: ubuntu-latest
    needs: build-windows-arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-arm64-release-archive
          path: release-asset
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-arm64-${{ github.run_number }}
          name: Windows arm64 build ${{ github.run_number }}
          prerelease: true
          files: release-asset/*.zip
